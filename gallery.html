<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전시 갤러리 · 데이터의 눈</title>
<link rel="stylesheet" href="css/site.css" />
<style>
  .gctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .rtabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .rtab { font: inherit; font-size: 13px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .rtab.on { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .rtab small { opacity: .7; margin-left: 3px; }

  /* ---- 3D 전시실 ---- */
  .scene { position: relative; height: 74vh; min-height: 460px; perspective: 1350px; perspective-origin: 50% 42%;
    overflow: hidden; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    background: radial-gradient(130% 100% at 50% 8%, #20222e 0%, #0a0b10 72%); cursor: grab; user-select: none; touch-action: none; }
  .scene.grab { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d;
    transform: rotateX(var(--rx, -3deg)) rotateY(var(--ry, 0deg)); transition: transform .14s ease-out; }
  .plane { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .wall { display: flex; align-items: center; justify-content: center; align-content: center; gap: 38px; flex-wrap: wrap; padding: 34px;
    background: linear-gradient(180deg, #262834 0%, #1a1c25 70%, #141620 100%); box-shadow: inset 0 0 140px rgba(0,0,0,.55); }
  .wall::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 16px; background: linear-gradient(180deg, rgba(255,255,255,.10), transparent); }
  .wall.back  { width: 1500px; height: 620px; margin: -310px 0 0 -750px; transform: translateZ(-575px); }
  .wall.left  { width: 1150px; height: 620px; margin: -310px 0 0 -575px; transform: translateX(-750px) rotateY(90deg); }
  .wall.right { width: 1150px; height: 620px; margin: -310px 0 0 -575px; transform: translateX(750px) rotateY(-90deg); }
  .floor { width: 1500px; height: 1150px; margin: -575px 0 0 -750px; transform: translateY(310px) rotateX(90deg);
    background: repeating-linear-gradient(90deg, #15161d, #15161d 78px, #11121a 78px, #11121a 80px), linear-gradient(180deg, #181922, #0c0d12); box-shadow: inset 0 0 220px rgba(0,0,0,.75); }
  .ceil { width: 1500px; height: 1150px; margin: -575px 0 0 -750px; transform: translateY(-310px) rotateX(-90deg); background: #0c0d12; }
  .ceil i { position: absolute; left: 18%; right: 18%; top: 46%; height: 8px; border-radius: 8px; background: #fdf3d6; box-shadow: 0 0 60px 18px rgba(253,243,214,.5); }

  /* ---- 작품(액자) ---- */
  .art { width: 200px; cursor: pointer; transition: transform .13s; }
  .art:hover { transform: translateY(-7px) scale(1.035); }
  .art .frame { position: relative; background: #0b0c11; border: 8px solid #2c2e3a; border-radius: 3px;
    box-shadow: 0 16px 34px rgba(0,0,0,.6), 0 0 0 1px #000, inset 0 0 0 2px #3a3d4d; overflow: hidden; }
  .art .frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.14), transparent 42%); pointer-events: none; }
  .art .frame img, .art .frame canvas { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #07080d; }
  .art .plate { margin: 10px auto 0; max-width: 190px; text-align: center; background: linear-gradient(180deg, #d8c9a0, #c3b387); color: #241d10;
    border-radius: 3px; padding: 5px 7px; font-size: 11px; line-height: 1.35; box-shadow: 0 5px 12px rgba(0,0,0,.45); }
  .art .plate b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .room-label { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 6; color: #e9ecf6;
    background: rgba(10,11,16,.62); border: 1px solid var(--line); border-radius: 999px; padding: 7px 18px; font-weight: 800; font-size: 14px; pointer-events: none; backdrop-filter: blur(5px); }
  .scene-hint { position: absolute; right: 12px; bottom: 11px; z-index: 6; color: var(--muted); font-size: 11.5px;
    background: rgba(10,11,16,.55); border-radius: 8px; padding: 4px 10px; pointer-events: none; }
  .navb { position: absolute; left: 12px; bottom: 11px; z-index: 6; display: flex; gap: 6px; }
  .navb button { width: 36px; height: 36px; border-radius: 10px; background: rgba(20,22,30,.85); border: 1px solid var(--line); color: var(--text); cursor: pointer; font-size: 15px; }
  .navb button:hover { border-color: var(--accent); }

  /* ---- 평면(그리드) 대체 ---- */
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .gal .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .gal .item img, .gal .item canvas { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #07080d; }
  .gal .item .meta { padding: 10px 12px; }
  .gal .item .meta h4 { margin: 0 0 2px; font-size: 14px; }
  .gal .item .meta p { margin: 0; color: var(--muted); font-size: 12px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app-header"></div>
<div class="wrap">
  <div class="page-head">
    <span class="eyebrow">전시 갤러리</span>
    <h1>주제별 3D 전시실에서 감상하기</h1>
    <p>또래의 작품이 <b>주제별 전시실</b>의 벽에 걸려 있어요. <b>드래그로 둘러보고</b>, 작품을 클릭해 <b>의도·근거·인터랙션·윤리</b> 네 기준으로 피드백을 남겨 보세요.</p>
  </div>
  <div id="idea"></div>
  <div id="empty" class="callout info hide"><span class="ic">💬</span><div>아직 전시된 작품이 없어요. 스튜디오에서 ‘전시하기’를 눌러 첫 작품을 올려 보세요!</div></div>

  <div id="stage-wrap">
    <div class="gctl">
      <div class="rtabs" id="rtabs"></div>
      <button id="btn-view" class="btn sm">▦ 평면 보기</button>
    </div>

    <div class="scene" id="scene">
      <div class="room-label" id="room-label"></div>
      <div class="world" id="world">
        <div class="plane ceil"><i></i></div>
        <div class="plane floor"></div>
        <div class="plane wall back"  id="wall-back"></div>
        <div class="plane wall left"  id="wall-left"></div>
        <div class="plane wall right" id="wall-right"></div>
      </div>
      <div class="room-label" style="top:auto; bottom:11px; left:50%; font-size:12px; font-weight:600" id="empty-room"></div>
      <div class="navb">
        <button id="nav-left" title="왼쪽 보기">‹</button>
        <button id="nav-reset" title="정면">⟳</button>
        <button id="nav-right" title="오른쪽 보기">›</button>
      </div>
      <div class="scene-hint">드래그로 둘러보기 · 작품 클릭 = 감상·피드백</div>
    </div>

    <div class="gal hide" id="gal"></div>
  </div>

  <p class="footer-note">피드백은 받은 사람이 2차 개선에 쓰는 선물이에요 · 존중하며 남겨 주세요</p>
</div>

<script src="js/explain.js"></script>
<script src="js/guide.js"></script>
<script src="js/auth.js"></script>
<script src="config/cloud-config.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script>
  const KIND = { color: '색 군집', data: '데이터 점', sound: '소리', life: '내 삶', object: '객체 감지', project: '사회문제', lab: '분석' };
  const esc = s => UI.escapeHTML(s == null ? '' : s);
  let ALL = [], curTheme = null, rx = -3, ry = 0;

  /* ----------------------------- 데이터 로드 ----------------------------- */
  async function load() {
    ALL = await Store.listWorks({ exhibited: true });
    document.getElementById('empty').classList.toggle('hide', ALL.length > 0);
    document.getElementById('stage-wrap').classList.toggle('hide', ALL.length === 0);
    if (!ALL.length) return;
    buildTabs();
    curTheme = themes()[0];
    renderRoom(curTheme);
    renderFlat();
  }
  function themes() { const s = []; ALL.forEach(w => { const k = w.kind || 'etc'; if (!s.includes(k)) s.push(k); }); return s; }

  function buildTabs() {
    const host = document.getElementById('rtabs');
    host.innerHTML = themes().map(k => {
      const n = ALL.filter(w => (w.kind || 'etc') === k).length;
      return `<button class="rtab" data-theme="${k}">${esc(KIND[k] || k)}실<small>${n}</small></button>`;
    }).join('');
    host.querySelectorAll('.rtab').forEach(b => b.addEventListener('click', () => {
      curTheme = b.dataset.theme; ry = 0; rx = -3; applyView(); renderRoom(curTheme);
    }));
  }

  /* ----------------------------- 3D 전시실 구성 ----------------------------- */
  function artHTML(w) {
    return `<div class="art" data-id="${w.id}" title="${esc(w.title || '무제')}">
      <div class="frame">${w.thumb ? `<img src="${w.thumb}" alt="${esc(w.title || '')}">` : `<canvas width="200" height="150"></canvas>`}</div>
      <div class="plate"><b>${esc(w.title || '무제')}</b>${esc(w.by || '익명')}</div>
    </div>`;
  }
  function renderRoom(theme) {
    const works = ALL.filter(w => (w.kind || 'etc') === theme);
    const back = [], left = [], right = [];
    works.forEach((w, i) => { const m = i % 4; if (m === 0 || m === 2) back.push(w); else if (m === 1) left.push(w); else right.push(w); });
    document.getElementById('wall-back').innerHTML = back.map(artHTML).join('');
    document.getElementById('wall-left').innerHTML = left.map(artHTML).join('');
    document.getElementById('wall-right').innerHTML = right.map(artHTML).join('');
    document.getElementById('room-label').textContent = '🏛 ' + (KIND[theme] || theme) + ' 전시실 · ' + works.length + '점';
    document.getElementById('empty-room').textContent = works.length ? '' : '이 전시실엔 아직 작품이 없어요';
    document.querySelectorAll('.rtab').forEach(b => b.classList.toggle('on', b.dataset.theme === theme));
    document.querySelectorAll('#scene .art').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); open(el.dataset.id); }));
  }

  /* ----------------------------- 둘러보기(드래그/버튼) ----------------------------- */
  const scene = document.getElementById('scene'), world = document.getElementById('world');
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function applyView() { world.style.setProperty('--ry', ry.toFixed(1) + 'deg'); world.style.setProperty('--rx', rx.toFixed(1) + 'deg'); }
  let drag = false, px = 0, py = 0, bry = 0, brx = 0;
  scene.addEventListener('pointerdown', e => { drag = true; px = e.clientX; py = e.clientY; bry = ry; brx = rx; scene.classList.add('grab'); scene.setPointerCapture && scene.setPointerCapture(e.pointerId); });
  scene.addEventListener('pointermove', e => { if (!drag) return; ry = clamp(bry + (e.clientX - px) * 0.18, -58, 58); rx = clamp(brx - (e.clientY - py) * 0.11, -20, 14); applyView(); });
  const endDrag = () => { drag = false; scene.classList.remove('grab'); };
  scene.addEventListener('pointerup', endDrag); scene.addEventListener('pointercancel', endDrag); scene.addEventListener('pointerleave', endDrag);
  document.getElementById('nav-left').addEventListener('click', () => { ry = clamp(ry + 22, -58, 58); applyView(); });
  document.getElementById('nav-right').addEventListener('click', () => { ry = clamp(ry - 22, -58, 58); applyView(); });
  document.getElementById('nav-reset').addEventListener('click', () => { ry = 0; rx = -3; applyView(); });

  /* ----------------------------- 평면 보기(대체) ----------------------------- */
  function renderFlat() {
    document.getElementById('gal').innerHTML = ALL.map(w => `
      <div class="item" data-id="${w.id}" style="cursor:pointer">
        ${w.thumb ? `<img src="${w.thumb}" alt="">` : `<canvas></canvas>`}
        <div class="meta"><h4>${esc(w.title || '무제')}</h4><p>${esc(w.by || '익명')} · ${esc(KIND[w.kind] || w.kind || '')}</p></div>
      </div>`).join('');
    document.querySelectorAll('#gal .item').forEach(el => el.addEventListener('click', () => open(el.dataset.id)));
  }
  document.getElementById('btn-view').addEventListener('click', () => {
    const flat = document.getElementById('gal'), sc = document.getElementById('scene'), tabs = document.getElementById('rtabs');
    const toFlat = flat.classList.contains('hide');
    flat.classList.toggle('hide', !toFlat); sc.classList.toggle('hide', toFlat); tabs.classList.toggle('hide', toFlat);
    document.getElementById('btn-view').textContent = toFlat ? '🏛 3D 전시실' : '▦ 평면 보기';
  });

  /* ----------------------------- 작품 감상·피드백 모달 ----------------------------- */
  async function open(id) {
    const w = await Store.getWork(id);
    if (!w) return;
    const fbs = await Store.listFeedback(id);
    const u = Auth.current();
    const fbList = fbs.length ? fbs.map(f => `<div class="lvl" style="margin:8px 0"><div class="lvl-b">
        <b>${esc(f.by || '익명')}</b> · 의도 ${'★'.repeat(f.intent || 0)} 근거 ${'★'.repeat(f.evidence || 0)} 인터랙션 ${'★'.repeat(f.interaction || 0)} 윤리 ${'★'.repeat(f.ethics || 0)}<br>${esc(f.comment || '')}
      </div></div>`).join('') : '<p class="muted">아직 피드백이 없어요. 첫 피드백을 남겨 보세요.</p>';
    const sel = (name) => `<select id="fb-${name}"><option value="3">잘됨 ★★★</option><option value="2" selected>보통 ★★</option><option value="1">아쉬움 ★</option></select>`;
    const body = `
      <canvas id="gal-live" style="width:100%;aspect-ratio:4/3;background:#07080d;border-radius:10px;border:1px solid var(--line);display:block"></canvas>
      <p style="margin:8px 0"><a href="work.html?id=${id}">🔍 단독 페이지·비평(펠드먼 4단계) →</a></p>
      <p style="margin:12px 0 4px"><b>의도</b> · ${esc(w.intent || '(없음)')}</p>
      ${w.evidence ? `<p style="margin:4px 0"><b>근거</b> · ${esc(w.evidence)}</p>` : ''}
      ${w.dataName ? `<p class="muted" style="font-size:12px">데이터: ${esc(w.dataName)}</p>` : ''}
      <hr class="sep"><h3 style="font-size:15px">또래 피드백</h3>${fbList}
      <hr class="sep"><h3 style="font-size:15px">피드백 남기기</h3>
      <div class="grid c4">
        <div><label class="field">의도 전달</label>${sel('intent')}</div>
        <div><label class="field">근거</label>${sel('evidence')}</div>
        <div><label class="field">인터랙션</label>${sel('interaction')}</div>
        <div><label class="field">윤리</label>${sel('ethics')}</div>
      </div>
      <label class="field">한마디(무엇이 의미를 전했나/방해했나, 근거와 함께)</label>
      <textarea id="fb-comment" rows="2" placeholder="존중하며, 구체적인 근거로"></textarea>
      <button class="btn primary" id="fb-submit" style="margin-top:10px">피드백 등록</button>`;
    UI.modal(esc(w.title || '작품') + ` <span class="badge">${esc(KIND[w.kind] || '')}</span>`, body, esc(w.by || ''));
    if (window.Player) { if (window._gP) window._gP.stop(); const gc = document.getElementById('gal-live'); if (gc) window._gP = Player.mount(gc, w, { interactive: true }); const cl = document.querySelector('#ui-modal .modal-close'); if (cl) cl.addEventListener('click', () => window._gP && window._gP.stop()); }
    document.getElementById('fb-submit').addEventListener('click', async () => {
      if (!u) { UI.toast('피드백하려면 로그인하세요.'); return; }
      await Store.addFeedback({ workId: id, by: u.display, userId: u.userId,
        intent: +document.getElementById('fb-intent').value, evidence: +document.getElementById('fb-evidence').value,
        interaction: +document.getElementById('fb-interaction').value, ethics: +document.getElementById('fb-ethics').value,
        comment: document.getElementById('fb-comment').value });
      UI.toast('피드백을 등록했습니다.'); open(id);
    });
  }

  /* ----------------------------- 시작 ----------------------------- */
  applyView();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('btn-view').click(); // 모션 최소화 선호 시 평면으로
  UI.mountIdeaBar('idea', 'gallery');
  load();
</script>
</body>
</html>
