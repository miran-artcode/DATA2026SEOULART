<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>전시 갤러리 · 데이터의 눈</title>
<link rel="stylesheet" href="css/site.css" />
<style>
  .gctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .rtabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .rtab { font: inherit; font-size: 13px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .rtab.on { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .rtab small { opacity: .7; margin-left: 3px; }

  /* ---- 3D 전시실 ---- */
  .scene { position: relative; height: 74vh; min-height: 460px; perspective: 1350px; perspective-origin: 50% 42%;
    overflow: hidden; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    background: radial-gradient(140% 100% at 50% 0%, #2b2a27 0%, #0d0c0b 72%); cursor: grab; user-select: none; touch-action: none; }
  .scene.grab { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-style: preserve-3d;
    transform: rotateX(var(--rx, -3deg)) rotateY(var(--ry, 0deg)) scale(var(--zoom, 1)); transition: transform .18s ease-out; }
  .plane { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
  .wall { display: flex; align-items: center; justify-content: center; align-content: center; gap: 44px; flex-wrap: wrap; padding: 42px 46px;
    background: linear-gradient(180deg, #3b3a44 0%, #322f39 52%, #2a2832 100%); box-shadow: inset 0 0 170px rgba(0,0,0,.5); }
  .wall::before { content: ""; position: absolute; left: 0; right: 0; top: 72px; height: 3px; background: rgba(255,255,255,.07); box-shadow: 0 1px 0 rgba(0,0,0,.3); }      /* 픽처 레일 */
  .wall::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.42)); border-top: 1px solid rgba(255,255,255,.05); } /* 걸레받이 */
  .wall.back  { width: 1500px; height: 620px; margin: -310px 0 0 -750px; transform: translateZ(-575px); }
  .wall.left  { width: 1150px; height: 620px; margin: -310px 0 0 -575px; transform: translateX(-750px) rotateY(90deg); }
  .wall.right { width: 1150px; height: 620px; margin: -310px 0 0 -575px; transform: translateX(750px) rotateY(-90deg); }
  .floor { width: 1500px; height: 1150px; margin: -575px 0 0 -750px; transform: translateY(310px) rotateX(90deg);
    background: repeating-linear-gradient(90deg, #2d2620 0%, #2d2620 94px, #261f18 94px, #261f18 98px), linear-gradient(180deg, #2b251d, #14110d); box-shadow: inset 0 0 240px rgba(0,0,0,.8); }
  .ceil { width: 1500px; height: 1150px; margin: -575px 0 0 -750px; transform: translateY(-310px) rotateX(-90deg); background: #0c0d12; }
  .ceil i { position: absolute; left: 18%; right: 18%; top: 46%; height: 8px; border-radius: 8px; background: #fdf3d6; box-shadow: 0 0 60px 18px rgba(253,243,214,.5); }

  /* ---- 작품(액자) ---- */
  .art { position: relative; width: 204px; cursor: pointer; transition: transform .13s; }
  .art:hover { transform: translateY(-7px) scale(1.035); }
  .art::before { content: ""; position: absolute; left: 50%; top: -52px; width: 150%; height: 92px; transform: translateX(-50%);
    background: radial-gradient(55% 82% at 50% 0%, rgba(255,246,220,.30), transparent 72%); pointer-events: none; z-index: 0; }   /* 스포트라이트 */
  .art .frame { position: relative; z-index: 1; background: #efe9dc; padding: 12px; border: 11px solid; border-radius: 2px;
    border-image: linear-gradient(135deg, #8a7340 0%, #5a4a29 45%, #322817 100%) 1;
    box-shadow: 0 22px 42px rgba(0,0,0,.6), 0 0 0 1px #000, inset 0 0 9px rgba(0,0,0,.22); }
  .art .frame::after { content: ""; position: absolute; inset: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); pointer-events: none; } /* 매트 안쪽 음영 */
  .art .frame img, .art .frame canvas { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #07080d; }
  .art .plate { position: relative; z-index: 1; margin: 13px auto 0; max-width: 200px; text-align: center; background: #f4efe3; color: #2a2114;
    border: 1px solid #cbbf9f; border-radius: 2px; padding: 6px 8px; font-size: 11px; line-height: 1.4; box-shadow: 0 6px 14px rgba(0,0,0,.4); }
  .art .plate b { display: block; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .art .plate .cap { display: block; margin-top: 4px; padding-top: 4px; border-top: 1px solid #d8cda7; color: #564a33; font-weight: 400; font-size: 10.5px; line-height: 1.34; max-height: 4em; overflow: hidden; white-space: normal; }
  .art.focus { transform: translateY(-12px) scale(1.14); z-index: 4; }
  .art.focus .frame { box-shadow: 0 28px 56px rgba(0,0,0,.72), 0 0 0 1px #000, 0 0 44px 8px rgba(255,238,190,.55); }
  .art.dim { opacity: .42; filter: saturate(.7); }
  .art .frame video { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #000; }

  /* ---- 도슨트 패널 ---- */
  .docent { position: absolute; left: 0; right: 0; bottom: 0; z-index: 8; padding: 16px 20px 18px; color: #eef1fb;
    background: linear-gradient(0deg, rgba(8,9,13,.94), rgba(8,9,13,.66) 72%, transparent); transform: translateY(101%); transition: transform .32s ease; }
  .docent.on { transform: none; }
  .docent h4 { margin: 0; font-size: 17px; }
  .docent h4 .by { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .docent p { margin: 7px 0 0; font-size: 13.5px; line-height: 1.62; max-height: 7em; overflow: auto; }
  .docent .dctrl { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 11px; }
  .docent .dctrl button { background: rgba(255,255,255,.1); border: 1px solid var(--line); color: #fff; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; }
  .docent .dctrl button:hover { border-color: var(--accent); }
  .docent .prog { color: var(--muted); font-size: 12px; margin-left: auto; }

  .room-label { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 6; color: #e9ecf6;
    background: rgba(10,11,16,.62); border: 1px solid var(--line); border-radius: 999px; padding: 7px 18px; font-weight: 800; font-size: 14px; pointer-events: none; backdrop-filter: blur(5px); }
  .scene-hint { position: absolute; right: 12px; bottom: 11px; z-index: 6; color: var(--muted); font-size: 11.5px;
    background: rgba(10,11,16,.55); border-radius: 8px; padding: 4px 10px; pointer-events: none; }
  .navb { position: absolute; left: 12px; bottom: 11px; z-index: 6; display: flex; gap: 6px; align-items: center; background: rgba(10,11,16,.5); border-radius: 12px; padding: 4px 8px; }
  .navb .navlbl { color: var(--muted); font-size: 11px; margin: 0 1px 0 3px; }
  .navb button { min-width: 34px; height: 32px; padding: 0 9px; border-radius: 9px; background: rgba(30,33,44,.92); border: 1px solid var(--line); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 700; }
  .navb button:hover { border-color: var(--accent); }

  /* ---- 평면(그리드) 대체 ---- */
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .gal .item { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .gal .item img, .gal .item canvas { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #07080d; }
  .gal .item .meta { padding: 10px 12px; }
  .gal .item .meta h4 { margin: 0 0 2px; font-size: 14px; }
  .gal .item .meta p { margin: 0; color: var(--muted); font-size: 12px; }

  /* ---- 작품 세부·데이터 보고서(모달) ---- */
  .report { margin: 6px 0 2px; }
  .placard { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; background: #f4efe3; color: #2a2114; border: 1px solid #cbbf9f; border-radius: 6px; padding: 11px 14px; }
  .placard b { font-size: 15px; }
  .placard .muted { color: #6b5d44 !important; font-size: 12px; }
  .rsrc { display: flex; align-items: center; gap: 11px; margin: 11px 0; }
  .rsrc img { width: 104px; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
  .rsrc span { font-size: 12.5px; color: var(--muted); }
  .rgrid, .rmeta, .rrecord { display: grid; gap: 5px; margin: 11px 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .rrow { display: flex; gap: 8px; font-size: 13px; align-items: baseline; }
  .rrow > span { color: var(--muted); min-width: 104px; flex: 0 0 auto; }
  .rrow > b { color: var(--text); font-weight: 600; }
  .rtitle { font-weight: 800; font-size: 13.5px; margin: 12px 0 4px; }
  .rtable { overflow: auto; max-height: 250px; border: 1px solid var(--line); border-radius: 10px; }
  .rtable table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .rtable th, .rtable td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; white-space: nowrap; }
  .rtable th { background: var(--panel2); position: sticky; top: 0; font-weight: 700; }

  /* ---- 전체화면 작품 뷰어 ---- */
  .viewer { position: fixed; inset: 0; z-index: 200; display: flex; background: rgba(6,7,11,.97); }
  .vinfo { width: 380px; max-width: 40%; flex: 0 0 auto; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 26px 24px; }
  .vinfo h2 { letter-spacing: -.3px; }
  .vstage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 30px;
    background: radial-gradient(circle at 50% 38%, #17181f 0%, #060709 78%); }
  .vstage-media { max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center; }
  .vstage-media canvas { height: 80vh; max-height: 84vh; max-width: 94%; aspect-ratio: 4 / 3; border-radius: 12px; box-shadow: 0 36px 92px rgba(0,0,0,.66); background: #07080d; }
  .vstage-media video { max-width: 100%; max-height: 84vh; border-radius: 12px; box-shadow: 0 36px 92px rgba(0,0,0,.66); background: #000; }
  @media (max-width: 820px) { .vstage-media canvas { height: 44vh; } }
  .vclose { position: absolute; top: 16px; right: 18px; z-index: 6; width: 44px; height: 44px; border-radius: 50%; background: rgba(22,24,32,.9); border: 1px solid var(--line); color: #fff; font-size: 18px; cursor: pointer; }
  .vclose:hover { border-color: var(--accent); }
  .vnav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 66px; border-radius: 12px; background: rgba(22,24,32,.72); border: 1px solid var(--line); color: #fff; font-size: 26px; cursor: pointer; z-index: 5; }
  .vnav:hover { border-color: var(--accent); }
  .vprev { left: 16px; } .vnext { right: 16px; }
  .vcount { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12.5px; background: rgba(10,11,16,.6); padding: 4px 12px; border-radius: 999px; }
  @media (max-width: 820px) { .viewer { flex-direction: column; } .vinfo { width: auto; max-width: none; max-height: 46%; border-right: 0; border-bottom: 1px solid var(--line); } .vstage-media canvas, .vstage-media video { max-height: 44vh; } }

  /* 뷰어 도구: 작품 줌·전체화면·설명 접기 */
  .vinfo { transition: width .25s ease, padding .25s ease; }
  .viewer.info-collapsed .vinfo { width: 0; padding: 0; border-right: 0; overflow: hidden; }
  .vtoggle { position: absolute; left: 380px; top: 50%; transform: translate(-50%, -50%); z-index: 7; width: 26px; height: 56px; border-radius: 8px; background: rgba(22,24,32,.92); border: 1px solid var(--line); color: #fff; cursor: pointer; font-size: 13px; transition: left .25s ease; }
  .vtoggle:hover { border-color: var(--accent); }
  .viewer.info-collapsed .vtoggle { left: 0; transform: translate(0, -50%); border-radius: 0 8px 8px 0; }
  .vstage { overflow: hidden; }
  .vstage-media { transition: transform .1s ease-out; will-change: transform; }
  .vtools { position: absolute; left: 16px; bottom: 16px; z-index: 6; display: flex; gap: 6px; align-items: center; background: rgba(10,11,16,.6); border-radius: 12px; padding: 4px 8px; }
  .vtools .navlbl { color: var(--muted); font-size: 11px; margin-right: 2px; }
  .vtools button { min-width: 32px; height: 30px; padding: 0 9px; border-radius: 8px; background: rgba(30,33,44,.92); border: 1px solid var(--line); color: #fff; cursor: pointer; font-size: 12.5px; font-weight: 700; }
  .vtools button:hover { border-color: var(--accent); }
  @media (max-width: 820px) { .vtoggle { left: 50%; top: 6px; transform: translate(-50%,0); width: 60px; height: 24px; } .viewer.info-collapsed .vinfo { width: auto; max-height: 0; padding: 0; border: 0; } }

  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app-header"></div>
<div class="wrap">
  <div class="page-head">
    <span class="eyebrow">전시 갤러리</span>
    <h1>주제별 3D 전시실에서 감상하기</h1>
    <p>또래의 작품이 <b>주제별 전시실</b>의 벽에 걸려 있어요. <b>드래그로 둘러보고</b>, 작품을 클릭해 <b>의도·근거·인터랙션·윤리</b> 네 기준으로 피드백을 남겨 보세요.</p>
  </div>
  <div id="idea"></div>
  <div id="empty" class="callout info hide"><span class="ic">💬</span><div>아직 전시된 작품이 없어요. 스튜디오에서 ‘전시하기’를 눌러 첫 작품을 올려 보세요!</div></div>

  <div id="stage-wrap">
    <div class="gctl">
      <div class="rtabs" id="rtabs"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button id="btn-ambient" class="btn sm">🎵 배경음</button>
        <button id="btn-docent" class="btn sm accent2">🎧 도슨트 모드</button>
        <button id="btn-view" class="btn sm">▦ 평면 보기</button>
      </div>
    </div>

    <div class="scene" id="scene">
      <div class="room-label" id="room-label"></div>
      <div class="world" id="world">
        <div class="plane ceil"><i></i></div>
        <div class="plane floor"></div>
        <div class="plane wall back"  id="wall-back"></div>
        <div class="plane wall left"  id="wall-left"></div>
        <div class="plane wall right" id="wall-right"></div>
      </div>
      <div class="room-label" style="top:auto; bottom:11px; left:50%; font-size:12px; font-weight:600" id="empty-room"></div>
      <div class="navb">
        <span class="navlbl">둘러보기</span>
        <button id="nav-left" title="왼쪽 보기">◀</button>
        <button id="nav-reset" title="정면·기본 배율로">정면</button>
        <button id="nav-right" title="오른쪽 보기">▶</button>
        <span class="navlbl">배율</span>
        <button id="zoom-out" title="축소">－</button>
        <button id="zoom-in" title="확대">＋</button>
      </div>
      <div class="docent" id="docent"></div>
      <div class="scene-hint">드래그 둘러보기 · 휠 확대/축소 · 작품 클릭=감상 · 🎧 도슨트</div>
    </div>

    <div class="gal hide" id="gal"></div>
  </div>

  <p class="footer-note">피드백은 받은 사람이 2차 개선에 쓰는 선물이에요 · 존중하며 남겨 주세요</p>
</div>

<div id="viewer" class="viewer hide">
  <aside class="vinfo"></aside>
  <button class="vtoggle" title="설명 접기/펴기">◀</button>
  <div class="vstage">
    <button class="vnav vprev" title="이전 작품 (←)">‹</button>
    <div class="vstage-media"></div>
    <button class="vnav vnext" title="다음 작품 (→)">›</button>
    <div class="vcount"></div>
    <div class="vtools">
      <span class="navlbl">작품 확대</span>
      <button id="mz-out" title="작품 축소">－</button>
      <button id="mz-reset" title="원본 크기로">1:1</button>
      <button id="mz-in" title="작품 확대">＋</button>
      <button id="v-full" title="전체화면">⛶</button>
    </div>
  </div>
  <button class="vclose" title="닫기 (Esc)">✕</button>
</div>

<script src="js/explain.js"></script>
<script src="js/guide.js"></script>
<script src="js/auth.js"></script>
<script src="config/cloud-config.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/player.js"></script>
<script>
  const KIND = { color: '색 군집', data: '데이터 점', sound: '소리', life: '내 삶', object: '객체 감지', project: '사회문제', word: '낱말 구름', lab: '분석' };
  const esc = s => UI.escapeHTML(s == null ? '' : s);
  const fmt = n => (typeof n === 'number' ? n.toLocaleString('ko-KR') : (n == null ? '' : n));
  const $ = id => document.getElementById(id);
  let ALL = [], curTheme = null, rx = -3, ry = 0, zoom = 1;
  let roomArts = [], docent = false, dIdx = 0, dTimer = null, speakOn = true;

  /* ----------------------------- 데이터 로드 ----------------------------- */
  async function load() {
    ALL = await Store.listWorks({ exhibited: true });
    document.getElementById('empty').classList.toggle('hide', ALL.length > 0);
    document.getElementById('stage-wrap').classList.toggle('hide', ALL.length === 0);
    if (!ALL.length) return;
    buildTabs();
    curTheme = themes()[0];
    renderRoom(curTheme);
    renderFlat();
  }
  function themes() { const s = []; ALL.forEach(w => { const k = w.kind || 'etc'; if (!s.includes(k)) s.push(k); }); return s; }

  function buildTabs() {
    const host = document.getElementById('rtabs');
    host.innerHTML = themes().map(k => {
      const n = ALL.filter(w => (w.kind || 'etc') === k).length;
      return `<button class="rtab" data-theme="${k}">${esc(KIND[k] || k)}실<small>${n}</small></button>`;
    }).join('');
    host.querySelectorAll('.rtab').forEach(b => b.addEventListener('click', () => {
      curTheme = b.dataset.theme; ry = 0; rx = -3; applyView(); renderRoom(curTheme);
    }));
  }

  /* ----------------------------- 3D 전시실 구성 ----------------------------- */
  function mediaHTML(w) {
    if (w.video) return `<video src="${w.video}" loop muted autoplay playsinline preload="metadata"></video>`;
    return w.thumb ? `<img src="${w.thumb}" alt="${esc(w.title || '')}">` : `<canvas width="200" height="150"></canvas>`;
  }
  function artHTML(w) {
    const full = (w.intent || w.evidence || '').trim();
    const cap = full ? esc(full.slice(0, 92)) + (full.length > 92 ? '…' : '') : '';
    return `<div class="art" data-id="${w.id}" title="${esc(w.title || '무제')}">
      <div class="frame">${mediaHTML(w)}</div>
      <div class="plate"><b>${esc(w.title || '무제')}</b>${esc(w.by || '익명')} · ${esc(KIND[w.kind] || '')}${cap ? `<span class="cap">${cap}</span>` : ''}</div>
    </div>`;
  }
  function renderRoom(theme) {
    if (docent) stopDocent();
    const works = ALL.filter(w => (w.kind || 'etc') === theme);
    const back = [], left = [], right = [];
    works.forEach((w, i) => { const m = i % 4; if (m === 0 || m === 2) back.push(w); else if (m === 1) left.push(w); else right.push(w); });
    $('wall-back').innerHTML = back.map(artHTML).join('');
    $('wall-left').innerHTML = left.map(artHTML).join('');
    $('wall-right').innerHTML = right.map(artHTML).join('');
    $('room-label').textContent = '🏛 ' + (KIND[theme] || theme) + ' 전시실 · ' + works.length + '점';
    const er = $('empty-room'); er.textContent = works.length ? '' : '이 전시실엔 아직 작품이 없어요'; er.style.display = works.length ? 'none' : '';
    document.querySelectorAll('.rtab').forEach(b => b.classList.toggle('on', b.dataset.theme === theme));
    roomArts = [];
    ['back', 'left', 'right'].forEach(wall => $('wall-' + wall).querySelectorAll('.art').forEach(el => {
      el.addEventListener('click', e => { e.stopPropagation(); openViewer(el.dataset.id); });
      roomArts.push({ w: works.find(x => x.id === el.dataset.id), el, wall });
    }));
  }

  /* ----------------------------- 둘러보기(드래그/버튼) ----------------------------- */
  const scene = document.getElementById('scene'), world = document.getElementById('world');
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function applyView() { world.style.setProperty('--ry', ry.toFixed(1) + 'deg'); world.style.setProperty('--rx', rx.toFixed(1) + 'deg'); world.style.setProperty('--zoom', zoom.toFixed(3)); }
  let drag = false, px = 0, py = 0, bry = 0, brx = 0;
  scene.addEventListener('pointerdown', e => { drag = true; px = e.clientX; py = e.clientY; bry = ry; brx = rx; scene.classList.add('grab'); scene.setPointerCapture && scene.setPointerCapture(e.pointerId); });
  scene.addEventListener('pointermove', e => { if (!drag) return; ry = clamp(bry + (e.clientX - px) * 0.18, -58, 58); rx = clamp(brx - (e.clientY - py) * 0.11, -20, 14); applyView(); });
  const endDrag = () => { drag = false; scene.classList.remove('grab'); };
  scene.addEventListener('pointerup', endDrag); scene.addEventListener('pointercancel', endDrag); scene.addEventListener('pointerleave', endDrag);
  $('nav-left').addEventListener('click', () => { ry = clamp(ry + 22, -58, 58); applyView(); });
  $('nav-right').addEventListener('click', () => { ry = clamp(ry - 22, -58, 58); applyView(); });
  $('nav-reset').addEventListener('click', () => { ry = 0; rx = -3; zoom = 1; applyView(); });
  $('zoom-in').addEventListener('click', () => { zoom = clamp(zoom + 0.2, 0.6, 2.6); applyView(); });
  $('zoom-out').addEventListener('click', () => { zoom = clamp(zoom - 0.2, 0.6, 2.6); applyView(); });
  scene.addEventListener('wheel', e => { e.preventDefault(); zoom = clamp(zoom - e.deltaY * 0.0012, 0.6, 2.6); applyView(); }, { passive: false });

  /* ----------------------------- 평면 보기(대체) ----------------------------- */
  function renderFlat() {
    document.getElementById('gal').innerHTML = ALL.map(w => `
      <div class="item" data-id="${w.id}" style="cursor:pointer">
        ${w.thumb ? `<img src="${w.thumb}" alt="">` : `<canvas></canvas>`}
        <div class="meta"><h4>${esc(w.title || '무제')}</h4><p>${esc(w.by || '익명')} · ${esc(KIND[w.kind] || w.kind || '')}</p></div>
      </div>`).join('');
    document.querySelectorAll('#gal .item').forEach(el => el.addEventListener('click', () => openViewer(el.dataset.id)));
  }
  document.getElementById('btn-view').addEventListener('click', () => {
    const flat = document.getElementById('gal'), sc = document.getElementById('scene'), tabs = document.getElementById('rtabs');
    const toFlat = flat.classList.contains('hide');
    flat.classList.toggle('hide', !toFlat); sc.classList.toggle('hide', toFlat); tabs.classList.toggle('hide', toFlat);
    document.getElementById('btn-view').textContent = toFlat ? '🏛 3D 전시실' : '▦ 평면 보기';
  });

  /* ----------------------------- 🎧 도슨트 모드(자동 해설 순회) ----------------------------- */
  function speak(text) { if (!speakOn || !window.speechSynthesis) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.02; speechSynthesis.speak(u); } catch (e) {} }
  function docentText(w) {
    const s = w.settings || {}, p = [];
    p.push(`${w.by || '익명'} 작가의 작품, ${w.title || '무제'} 입니다.`);
    if (w.intent) p.push(`작가의 의도는, ${w.intent}.`);
    if (w.evidence) p.push(`그 근거로, ${w.evidence}.`);
    if (w.kind === 'color' && s.K != null) p.push(`대표색 ${s.K}개로 분석해 점 ${fmt(s.N) || ''}개로 다시 그렸습니다.`);
    if (w.kind === 'data' && s.dataName) p.push(`${s.dataName} 데이터를 점의 움직임으로 옮겼습니다.`);
    return p.join(' ');
  }
  function startDocent() {
    if (!roomArts.length) { UI.toast('이 전시실엔 작품이 없어요.'); return; }
    docent = true; dIdx = 0; $('btn-docent').textContent = '⏹ 도슨트 끝'; $('docent').classList.add('on'); docentStep();
  }
  function stopDocent() {
    docent = false; clearTimeout(dTimer); dTimer = null; if (window.speechSynthesis) speechSynthesis.cancel();
    $('btn-docent').textContent = '🎧 도슨트 모드'; $('docent').classList.remove('on');
    roomArts.forEach(a => a.el.classList.remove('focus', 'dim'));
  }
  function docentStep() {
    clearTimeout(dTimer); if (!docent || !roomArts.length) return;
    dIdx = (dIdx % roomArts.length + roomArts.length) % roomArts.length;
    const a = roomArts[dIdx], w = a.w;
    roomArts.forEach(x => { x.el.classList.toggle('focus', x === a); x.el.classList.toggle('dim', x !== a); });
    ry = a.wall === 'left' ? 42 : a.wall === 'right' ? -42 : 0; rx = -2; zoom = 1.3; applyView();
    const narr = docentText(w);
    $('docent').innerHTML = `<h4>🎧 ${esc(w.title || '무제')} <span class="by">· ${esc(w.by || '익명')} · ${esc(KIND[w.kind] || '')}</span></h4>
      <p>${esc(narr)}</p>
      <div class="dctrl"><button id="d-prev">‹ 이전</button><button id="d-pause">⏸ 멈춤</button><button id="d-next">다음 ›</button>
        <button id="d-open">작품 자세히 보기</button><button id="d-mute">${speakOn ? '🔊 해설 끄기' : '🔈 해설 켜기'}</button>
        <button id="d-exit">✕ 종료</button><span class="prog">${dIdx + 1} / ${roomArts.length}</span></div>`;
    $('d-prev').onclick = () => { dIdx--; docentStep(); };
    $('d-next').onclick = () => { dIdx++; docentStep(); };
    $('d-open').onclick = () => openViewer(w.id);
    $('d-exit').onclick = stopDocent;
    $('d-mute').onclick = () => { speakOn = !speakOn; if (!speakOn && window.speechSynthesis) speechSynthesis.cancel(); else speak(narr); $('d-mute').textContent = speakOn ? '🔊 해설 끄기' : '🔈 해설 켜기'; };
    $('d-pause').onclick = () => { if (dTimer) { clearTimeout(dTimer); dTimer = null; $('d-pause').textContent = '▶ 계속'; if (window.speechSynthesis) speechSynthesis.cancel(); } else { $('d-pause').textContent = '⏸ 멈춤'; dTimer = setTimeout(() => { dIdx++; docentStep(); }, 6500); } };
    speak(narr);
    dTimer = setTimeout(() => { if (docent) { dIdx++; docentStep(); } }, 9000);
  }
  $('btn-docent').addEventListener('click', () => { docent ? stopDocent() : startDocent(); });

  /* ----------------------------- 세부 내용 · 데이터 보고서 ----------------------------- */
  function rrow(label, val) { return (val || val === 0) ? `<div class="rrow"><span>${esc(label)}</span><b>${esc(val)}</b></div>` : ''; }
  function reportHTML(w, skipPlacard) {
    const s = w.settings || {}, m = w.meta || {};
    let h = '<div class="report">';
    if (!skipPlacard) h += `<div class="placard"><div><b>${esc(w.title || '무제')}</b><br><span class="muted">${esc(w.by || '익명')}${w.klass ? ' · ' + esc(w.klass) : ''} · ${esc(KIND[w.kind] || w.kind || '')}</span></div>`
       + (w.createdAt ? `<span class="muted" style="white-space:nowrap">${new Date(w.createdAt).toLocaleDateString('ko-KR')}</span>` : '') + '</div>';
    if (w.kind === 'color') {
      if (w.srcImg) h += `<div class="rsrc"><img src="${w.srcImg}" alt="원본"><span><b>원본</b> → 데이터(점)로 재창조한 작품</span></div>`;
      h += '<div class="rtitle">🔬 분석 · 설정 보고서</div><div class="rgrid">';
      h += rrow('K (대표색)', s.K != null ? fmt(s.K) + '색' : '') + rrow('점 개수 N', s.N != null ? fmt(s.N) : '')
         + rrow('색공간', ({ rgb: 'RGB', lab: 'LAB' })[s.space] || s.space)
         + rrow('샘플링', ({ uniform: '무작위', bright: '밝은영역', dark: '어두운영역', edge: '윤곽' })[s.sampling] || s.sampling)
         + rrow('색 모드', ({ cluster: '대표색', original: '원본색', mono: '명암' })[s.colorMode] || s.colorMode)
         + rrow('표현 모드', ({ points: '점', lines: '점+선', '3d': '3D 조각' })[s.mode] || s.mode);
      h += '</div>';
      if (m.artist || m.source || m.student) {
        h += '<div class="rtitle">🏷 작품 정보</div><div class="rmeta">' + rrow('작가', m.artist) + rrow('출처·라이선스', m.source) + rrow('제작자', m.student) + '</div>';
      }
    } else if (w.kind === 'data') {
      const rec = s.record || {};
      if (rec.sense || rec.count || rec.omit || rec.scale || rec.miss) {
        h += '<div class="rtitle">📝 데이터 선택 기록 (작가노트)</div><div class="rrecord">'
           + rrow('① 감각 먼저', rec.sense) + rrow('② 무엇을 셌나', rec.count) + rrow('③ 무엇을 뺐나', rec.omit) + rrow('④ 왜 이 척도·매핑', rec.scale) + rrow('⑤ 놓친 진실', rec.miss) + '</div>';
      }
      const mp = s.mapping || {};
      h += '<div class="rtitle">🎛 매핑 · 움직임 보고서</div><div class="rgrid">'
         + rrow('데이터 주제', s.dataName) + rrow('크기 ←', mp.size) + rrow('속도 ←', mp.speed) + rrow('방향 ←', mp.direction) + rrow('밀도 ←', mp.density)
         + rrow('색 방식', ({ gradient: '그라데이션', category: '범주별', solid: '단색' })[mp.colorMode] || mp.colorMode)
         + rrow('배치', ({ timeline: '시간축', radial: '원형', grid: '격자', flowField: '값 산포' })[s.layout] || s.layout)
         + rrow('움직임', ({ vibrate: '제자리 진동', orbit: '궤도', wave: '파동', burst: '분출' })[s.motionStyle] || s.motionStyle) + '</div>';
      if (s.fields && s.fields.length && s.rows && s.rows.length) {
        const cols = s.fields.map(f => f.name);
        h += `<div class="rtitle">📊 데이터 보고서 · ${fmt(s.rows.length)}행 × ${cols.length}열</div>`
           + `<div class="rtable"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`
           + s.rows.slice(0, 14).map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
        if (s.rows.length > 14) h += `<p class="muted" style="font-size:11px; margin:4px 0 0">… 외 ${fmt(s.rows.length - 14)}행</p>`;
      }
    }
    return h + '</div>';
  }

  /* ----------------------------- 전체화면 작품 뷰어 (왼쪽 설명 + 작품 재생) ----------------------------- */
  let vWorks = [], vIdx = 0, vPlayer = null, mz = 1;
  function resetMediaZoom() { mz = 1; const m = $('viewer').querySelector('.vstage-media'); if (m) { m.style.transformOrigin = '50% 50%'; m.style.transform = 'scale(1)'; } }
  function toggleFull() { const el = $('viewer'), d = document; if (!d.fullscreenElement && !d.webkitFullscreenElement) (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); else (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d); }
  function closeViewer() {
    if (vPlayer) { try { vPlayer.stop(); } catch (e) {} vPlayer = null; }
    const v = $('viewer'); v.classList.add('hide'); v.querySelector('.vstage-media').innerHTML = '';
    document.body.style.overflow = '';
  }
  function openViewer(id) {
    vWorks = (roomArts.length ? roomArts.map(a => a.w) : ALL).filter(Boolean);
    vIdx = Math.max(0, vWorks.findIndex(w => w && w.id === id));
    $('viewer').classList.remove('hide'); document.body.style.overflow = 'hidden';
    showViewer();
  }
  async function showViewer() {
    const base = vWorks[vIdx]; if (!base) return;
    const w = (await Store.getWork(base.id)) || base;
    if (vPlayer) { try { vPlayer.stop(); } catch (e) {} vPlayer = null; }
    const v = $('viewer'), stage = v.querySelector('.vstage-media');
    if (w.video) stage.innerHTML = `<video src="${w.video}" controls autoplay loop playsinline></video>`;
    else { stage.innerHTML = '<canvas id="viewer-canvas"></canvas>'; if (window.Player) vPlayer = Player.mount($('viewer-canvas'), w, { interactive: true }); }
    resetMediaZoom();
    const fbs = await Store.listFeedback(w.id), u = Auth.current();
    v.querySelector('.vinfo').innerHTML = leftHTML(w, fbs);
    v.querySelector('.vcount').textContent = (vIdx + 1) + ' / ' + vWorks.length;
    bindFeedback(w.id, u);
  }
  function leftHTML(w, fbs) {
    const fbList = fbs.length ? fbs.map(f => `<div class="lvl" style="margin:8px 0"><div class="lvl-b">
        <b>${esc(f.by || '익명')}</b> · 의도 ${'★'.repeat(f.intent || 0)} 근거 ${'★'.repeat(f.evidence || 0)} 인터랙션 ${'★'.repeat(f.interaction || 0)} 윤리 ${'★'.repeat(f.ethics || 0)}<br>${esc(f.comment || '')}
      </div></div>`).join('') : '<p class="muted">아직 피드백이 없어요. 첫 피드백을 남겨 보세요.</p>';
    const sel = n => `<select id="fb-${n}"><option value="3">잘됨 ★★★</option><option value="2" selected>보통 ★★</option><option value="1">아쉬움 ★</option></select>`;
    return `<h2 style="margin:0 0 2px; font-size:21px">${esc(w.title || '무제')}</h2>
      <p class="muted" style="margin:0 0 14px">${esc(w.by || '익명')}${w.klass ? ' · ' + esc(w.klass) : ''} · ${esc(KIND[w.kind] || w.kind || '')}</p>
      <p style="margin:0 0 4px"><b>의도</b> · ${esc(w.intent || '(없음)')}</p>
      ${w.evidence ? `<p style="margin:4px 0"><b>근거</b> · ${esc(w.evidence)}</p>` : ''}
      ${reportHTML(w, true)}
      <p style="margin:10px 0"><a href="work.html?id=${w.id}">🔍 단독 페이지·비평(펠드먼 4단계) →</a></p>
      <hr class="sep"><h3 style="font-size:15px">또래 피드백</h3>${fbList}
      <hr class="sep"><h3 style="font-size:15px">피드백 남기기</h3>
      <div class="grid c2">
        <div><label class="field">의도 전달</label>${sel('intent')}</div>
        <div><label class="field">근거</label>${sel('evidence')}</div>
        <div><label class="field">인터랙션</label>${sel('interaction')}</div>
        <div><label class="field">윤리</label>${sel('ethics')}</div>
      </div>
      <label class="field">한마디(무엇이 의미를 전했나/방해했나)</label>
      <textarea id="fb-comment" rows="2" placeholder="존중하며, 구체적인 근거로"></textarea>
      <button class="btn primary wide" id="fb-submit" style="margin-top:10px">피드백 등록</button>`;
  }
  function bindFeedback(id, u) {
    const b = $('fb-submit'); if (!b) return;
    b.onclick = async () => {
      if (!u) { UI.toast('피드백하려면 로그인하세요.'); return; }
      const val = n => { const el = $('fb-' + n); return el ? +el.value : 0; };
      await Store.addFeedback({ workId: id, by: u.display, userId: u.userId, intent: val('intent'), evidence: val('evidence'), interaction: val('interaction'), ethics: val('ethics'), comment: ($('fb-comment') || {}).value || '' });
      UI.toast('피드백을 등록했습니다.'); showViewer();
    };
  }
  (function bindViewer() {
    const v = $('viewer');
    v.querySelector('.vclose').addEventListener('click', closeViewer);
    v.querySelector('.vprev').addEventListener('click', () => { if (vWorks.length) { vIdx = (vIdx - 1 + vWorks.length) % vWorks.length; showViewer(); } });
    v.querySelector('.vnext').addEventListener('click', () => { if (vWorks.length) { vIdx = (vIdx + 1) % vWorks.length; showViewer(); } });
    document.addEventListener('keydown', e => {
      if (v.classList.contains('hide')) return;
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowRight' && vWorks.length) { vIdx = (vIdx + 1) % vWorks.length; showViewer(); }
      else if (e.key === 'ArrowLeft' && vWorks.length) { vIdx = (vIdx - 1 + vWorks.length) % vWorks.length; showViewer(); }
    });
    const sm = v.querySelector('.vstage-media');
    sm.addEventListener('wheel', e => { e.preventDefault(); const r = sm.getBoundingClientRect(); sm.style.transformOrigin = ((e.clientX - r.left) / r.width * 100) + '% ' + ((e.clientY - r.top) / r.height * 100) + '%'; mz = clamp(mz - e.deltaY * 0.0016, 1, 5); sm.style.transform = 'scale(' + mz + ')'; }, { passive: false });
    $('mz-in').addEventListener('click', () => { sm.style.transformOrigin = '50% 50%'; mz = clamp(mz + 0.3, 1, 5); sm.style.transform = 'scale(' + mz + ')'; });
    $('mz-out').addEventListener('click', () => { mz = clamp(mz - 0.3, 1, 5); sm.style.transform = 'scale(' + mz + ')'; });
    $('mz-reset').addEventListener('click', resetMediaZoom);
    $('v-full').addEventListener('click', toggleFull);
    v.querySelector('.vtoggle').addEventListener('click', () => { const c = v.classList.toggle('info-collapsed'); v.querySelector('.vtoggle').textContent = c ? '▶' : '◀'; });
  })();

  /* ----------------------------- 🎵 배경음 (절차적 앰비언트) ----------------------------- */
  let actx = null, ambGain = null, ambNodes = [], ambOn = false;
  function ambientStart() {
    if (ambOn) return true;
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { UI.toast('이 브라우저는 배경음을 지원하지 않아요.'); return false; }
    if (actx.state === 'suspended') actx.resume();
    ambGain = actx.createGain(); ambGain.gain.value = 0; ambGain.connect(actx.destination);
    const chord = [174.61, 220.00, 261.63, 329.63];   // 부드러운 패드 화음
    ambNodes = chord.map((f, i) => {
      const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = actx.createGain(); g.gain.value = 0.2;
      const lfo = actx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.05 + 0.02 * i;
      const lg = actx.createGain(); lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(ambGain); o.start(); lfo.start();
      return { o, lfo };
    });
    ambGain.gain.linearRampToValueAtTime(0.05, actx.currentTime + 2.5);   // 아주 잔잔하게
    ambOn = true; return true;
  }
  function ambientStop() {
    if (!ambOn) return; ambOn = false;
    try { ambGain.gain.linearRampToValueAtTime(0, actx.currentTime + 1.2); } catch (e) {}
    const nodes = ambNodes; ambNodes = [];
    setTimeout(() => nodes.forEach(n => { try { n.o.stop(); n.lfo.stop(); } catch (e) {} }), 1400);
  }
  $('btn-ambient').addEventListener('click', () => {
    if (ambOn) { ambientStop(); $('btn-ambient').textContent = '🎵 배경음'; }
    else if (ambientStart()) $('btn-ambient').textContent = '🔇 배경음 끄기';
  });

  /* ----------------------------- 시작 ----------------------------- */
  applyView();
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('btn-view').click(); // 모션 최소화 선호 시 평면으로
  UI.mountIdeaBar('idea', 'gallery');
  load();
</script>
